name: agent-stack

x-api-worker-env: &api-worker-env
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/multi_agent_s2c
  LANGGRAPH_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/multi_agent_s2c
  REDIS_URL: redis://redis:6379/0
  ENABLE_RUN_QUEUE: "true"
  ARQ_MAX_JOBS: "${ARQ_MAX_JOBS:-64}"
  SANDBOX_PROVISIONER_URL: http://sandbox:8002
  SATELLITE_GATEWAY_TARGET: gateway:50051
  SATELLITE_GATEWAY_PROJECT_ID: ${SATELLITE_GATEWAY_PROJECT_ID:-demo-satellite}
  SATELLITE_GATEWAY_TOKEN: ${SATELLITE_GATEWAY_TOKEN:-development-only-change-me}

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: s2c-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./save/volume/minio/data:/data
    networks:
      - s2c-network
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.6
    container_name: s2c-rustfs
    profiles:
      - rustfs
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    ports:
      - "127.0.0.1:${RUSTFS_API_PORT:-29000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-29001}:9001"
    volumes:
      - ./save/volume/rustfs/data:/data
    networks:
      - s2c-network
    restart: unless-stopped

  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: s2c-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-multi_agent_s2c}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./save/volume/postgres/data:/var/lib/postgresql/data
    networks:
      - s2c-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-multi_agent_s2c}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    image: multi-agent-s2c-gateway:${VERSION:-0.1.0}
    container_name: s2c-gateway
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-multi_agent_s2c}
      GATEWAY_GRPC_ADDRESS: ":50051"
      GATEWAY_HEALTH_ADDRESS: ":8080"
      GATEWAY_SHARED_TOKEN: ${SATELLITE_GATEWAY_TOKEN:-development-only-change-me}
    ports:
      - "${SATELLITE_GATEWAY_PORT:-50051}:50051"
      - "${SATELLITE_GATEWAY_HEALTH_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - s2c-network
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: s2c-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./save/volume/redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - s2c-network
    restart: unless-stopped

  sandbox:
    build:
      context: ./sandbox_server
      dockerfile: Dockerfile
    image: multi-agent-s2c-sandbox:${VERSION:-0.1.0}
    container_name: s2c-sandbox
    environment:
      PROVISIONER_BACKEND: docker
      DOCKER_SANDBOX_HOST: host.docker.internal
    ports:
      - "${SANDBOX_PROVISIONER_PORT:-8002}:8002"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./save/volume/sandbox:/app/saves
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; response = urlopen('http://localhost:8002/health', timeout=3); raise SystemExit(0 if response.status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - s2c-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: multi-agent-s2c:${VERSION:-0.1.0}
    container_name: s2c-api
    ports:
      - "5050:5050"
    env_file:
      - ./.env
    environment:
      <<: *api-worker-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox:
        condition: service_healthy
      gateway:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - s2c-network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: multi-agent-s2c:${VERSION:-0.1.0}
    container_name: s2c-arq-worker
    command:
      - uv
      - run
      - --no-sync
      - arq
      - server.worker.WorkerSettings
    env_file:
      - ./.env
    environment:
      <<: *api-worker-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox:
        condition: service_healthy
      gateway:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - s2c-network
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.6.4
    container_name: s2c-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      COMMON_STORAGETYPE: local
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_METRICS_PORT:-9091}:9091"
    volumes:
      - ./save/volume/milvus/data:/var/lib/milvus
    networks:
      - s2c-network
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: s2c-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/password}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - ./save/volume/neo4j/data:/data
      - ./save/volume/neo4j/logs:/logs
      - ./save/volume/neo4j/import:/var/lib/neo4j/import
      - ./save/volume/neo4j/plugins:/plugins
    networks:
      - s2c-network
    restart: unless-stopped

networks:
  s2c-network:
    driver: bridge
