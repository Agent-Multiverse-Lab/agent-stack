name: multi-agent-s2c

x-api-worker-env: &api-worker-env
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/multi_agent_s2c
  LANGGRAPH_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/multi_agent_s2c
  REDIS_URL: redis://redis:6379/0
  ENABLE_RUN_QUEUE: "true"
  ARQ_MAX_JOBS: "${ARQ_MAX_JOBS:-64}"
  SANDBOX_PROVISIONER_URL: http://sandbox:8002

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: s2c-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./volume/minio/data:/data
    networks:
      - s2c-network
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: s2c-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-multi_agent_s2c}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./volume/postgres/data:/var/lib/postgresql/data
    networks:
      - s2c-network
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: s2c-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./volume/redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - s2c-network
    restart: unless-stopped

  sandbox:
    build:
      context: ../sandbox_server
      dockerfile: Dockerfile
    image: multi-agent-s2c-sandbox:${VERSION:-0.1.0}
    container_name: s2c-sandbox
    environment:
      PROVISIONER_BACKEND: docker
      DOCKER_SANDBOX_HOST: host.docker.internal
    ports:
      - "${SANDBOX_PROVISIONER_PORT:-8002}:8002"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./volume/sandbox:/app/saves
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; response = urlopen('http://localhost:8002/health', timeout=3); raise SystemExit(0 if response.status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - s2c-network
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    image: multi-agent-s2c:${VERSION:-0.1.0}
    container_name: s2c-api
    ports:
      - "5050:5050"
    env_file:
      - ../.env
    environment:
      <<: *api-worker-env
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - s2c-network
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    image: multi-agent-s2c:${VERSION:-0.1.0}
    container_name: s2c-arq-worker
    command:
      - uv
      - run
      - --no-sync
      - arq
      - server.worker.WorkerSettings
    env_file:
      - ../.env
    environment:
      <<: *api-worker-env
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - s2c-network
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.6.4
    container_name: s2c-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      COMMON_STORAGETYPE: local
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_METRICS_PORT:-9091}:9091"
    volumes:
      - ./volume/milvus/data:/var/lib/milvus
    networks:
      - s2c-network
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: s2c-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/password}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - ./volume/neo4j/data:/data
      - ./volume/neo4j/logs:/logs
      - ./volume/neo4j/import:/var/lib/neo4j/import
      - ./volume/neo4j/plugins:/plugins
    networks:
      - s2c-network
    restart: unless-stopped

networks:
  s2c-network:
    driver: bridge
