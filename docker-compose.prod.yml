# Use with: docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d
# .env.prod is a local secret file and is not committed.
services:
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-multi_agent_s2c}
    ports: !override []

  redis:
    ports: !override []

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env.prod}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env.prod}
    ports: !override []

  sandbox:
    ports: !override []

  api:
    env_file: !override
      - ./.env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}@postgres:5432/${POSTGRES_DB:-multi_agent_s2c}
      LANGGRAPH_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}@postgres:5432/${POSTGRES_DB:-multi_agent_s2c}
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
    ports: !override
      - "127.0.0.1:${API_PORT:-5050}:5050"

  worker:
    env_file: !override
      - ./.env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}@postgres:5432/${POSTGRES_DB:-multi_agent_s2c}
      LANGGRAPH_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}@postgres:5432/${POSTGRES_DB:-multi_agent_s2c}
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"

  rustfs:
    ports: !override []

  milvus:
    ports: !override []

  neo4j:
    ports: !override []
